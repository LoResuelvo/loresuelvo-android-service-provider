name: CI Build & Test

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The emulator has a substantial startup cost, so only run device tests when
  # Android production/test code or the device-test configuration changes.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      instrumented: ${{ steps.filter.outputs.instrumented }}
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            instrumented:
              - 'app/src/main/**'
              - 'app/src/androidTest/**'
              - 'app/build.gradle.kts'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle/**'
              - 'gradle.properties'
              - 'gradlew'
              - 'app/src/main/AndroidManifest.xml'
              - 'Makefile'
              - 'scripts/run_acceptance_tests.sh'
              - 'scripts/with-android-env.sh'
              - '.github/workflows/ci.yml'
              - '.github/workflows/avd-bootstrap.yml'

  # Delivery tooling is independent of Android verification. Keeping it as a
  # separate job preserves the checks without adding them to the Android path.
  delivery:
    name: Delivery checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/delivery-mcp/package-lock.json

      - name: Install delivery dependencies
        run: npm ci --prefix tools/delivery-mcp

      - name: Run delivery unit tests
        run: npm test --prefix tools/delivery-mcp

      - name: Run delivery smoke test
        run: npm run smoke --prefix tools/delivery-mcp

  lint-and-unit:
    name: Lint + Unit Tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Run lint and unit tests
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.provider.staging"
        run: |
          make lint FLAVOR=Staging
          make test FLAVOR=Staging

  instrumented-tests:
    name: Instrumented Tests (Emulator)
    needs: changes
    if: needs.changes.outputs.instrumented == 'true'
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Restore Android emulator SDK cache
        id: android-sdk-cache
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/emulator
            /usr/local/lib/android/sdk/system-images/android-34/default/x86_64
          key: ${{ runner.os }}-android-sdk-api34-x86_64-v1
          restore-keys: |
            ${{ runner.os }}-android-sdk-api34-x86_64-

      - name: Report Android emulator SDK cache
        env:
          ANDROID_SDK_CACHE_HIT: ${{ steps.android-sdk-cache.outputs.cache-hit || 'false' }}
        run: echo "ANDROID_SDK_CACHE_HIT=$ANDROID_SDK_CACHE_HIT"

      - name: Restore prewarmed AVD cache
        id: avd-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            /home/runner/.android/avd/test.avd
            /home/runner/.android/avd/test.ini
          key: ${{ runner.os }}-avd-api34-x86_64-pixel6-v1
          restore-keys: |
            ${{ runner.os }}-avd-api34-x86_64-pixel6-

      - name: Report prewarmed AVD cache
        env:
          AVD_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit || 'false' }}
        run: echo "AVD_CACHE_HIT=$AVD_CACHE_HIT"

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Compile before booting the emulator so the device-test step only pays
      # the installation and execution cost.
      - name: Build instrumented artifacts
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.provider.staging"
        run: ./scripts/with-android-env.sh ./gradlew assembleStagingDebug assembleStagingDebugAndroidTest

      - name: Run Android instrumented tests
        uses: ReactiveCircus/android-emulator-runner@v2
        env:
          AVD_CACHE_HIT: ${{ steps.avd-cache.outputs.cache-hit || 'false' }}
          GRADLE_OPTS: -Dorg.gradle.logging.level=info
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.provider.staging"
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          avd-name: test
          force-avd-creation: false
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -snapshot ci-clean -no-snapshot-save
          script: |
            echo "AVD_CACHE_HIT=$AVD_CACHE_HIT"
            make e2e FLAVOR=Staging

  apk-build:
    name: Build APK Staging (verification)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Build APK
        env:
          AUTH0_DOMAIN_STAGING: ${{ secrets.AUTH0_DOMAIN_STAGING }}
          AUTH0_CLIENT_ID_STAGING: ${{ secrets.AUTH0_CLIENT_ID_STAGING }}
          AUTH0_AUDIENCE_STAGING: ${{ secrets.AUTH0_AUDIENCE_STAGING }}
          API_URL_STAGING: ${{ secrets.API_URL_STAGING }}
          AUTH0_SCHEME_STAGING: "com.loresuelvo.provider.staging"
        run: make build FLAVOR=Staging
